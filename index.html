<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siege</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="hud" class="hidden">
      <div id="hud-left" class="panel">
        <div id="lvl-name"></div>
        <div id="timer">0:00</div>
        <ul id="objectives"></ul>
      </div>
      <div id="hud-right" class="panel">
        <div class="row"><span>Wind</span><span id="wind"></span></div>
        <div class="row"><span>Cannon</span><div class="bar"><div id="hp-fill"></div></div></div>
        <div class="row"><span>Collateral</span><span id="collateral">0</span></div>
        <div class="row" id="blind-row"><span>Enemy guns</span><span id="blind"></span></div>
      </div>
      <div id="aim-readout" class="panel"></div>
      <div id="ammo-bar"></div>
      <div id="toasts"></div>
      <div id="tooltip" class="panel hidden"></div>
      <div id="help">Drag to aim &amp; release to fire · Arrows fine-tune · Space fires · Tap/Space in flight: special · 1–9 ammo · Wheel zoom</div>
    </div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
